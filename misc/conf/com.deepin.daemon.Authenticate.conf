<?xml version="1.0" encoding="UTF-8"?> <!-- -*- XML -*- -->

<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Only root can own the service -->
  <policy user="root">
    <allow own="com.lingmo.daemon.Authenticate"/>
    <allow own="com.lingmo.daemon.Authenticate.Fingerprint"/>
  </policy>

  <!-- Allow anyone to invoke methods on the interfaces -->
  <policy context="default">
    <allow send_destination="com.lingmo.daemon.Authenticate"/>

    <allow send_destination="com.lingmo.daemon.Authenticate"
           send_interface="com.lingmo.daemon.Authenticate"/>
    <allow send_destination="com.lingmo.daemon.Authenticate"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="com.lingmo.daemon.Authenticate"
           send_interface="org.freedesktop.DBus.Introspectable"/>

   <!--Fingerprint-->
    <allow send_destination="com.lingmo.daemon.Authenticate.Fingerprint"/>

    <allow send_destination="com.lingmo.daemon.Authenticate.Fingerprint"
           send_interface="com.lingmo.daemon.Authenticate.Fingerprint"/>
    <allow send_destination="com.lingmo.daemon.Authenticate.Fingerprint"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="com.lingmo.daemon.Authenticate.Fingerprint"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>

</busconfig>
